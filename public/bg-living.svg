<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- ห้องนั่งเล่นขาวดำ (ใช้เป็นพื้นหลังเบลอ แทนรูปถ่าย) -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <!-- หน้าต่างบานใหญ่ -->
  <rect x="980" y="90" width="520" height="560" fill="url(#win)"/>
  <rect x="1232" y="90" width="16" height="560" fill="#7a7a7a"/>
  <rect x="980" y="360" width="520" height="12" fill="#7a7a7a"/>
  <rect x="960" y="70" width="560" height="22" fill="#6f6f6f"/>
  <!-- ม่าน -->
  <rect x="930" y="80" width="70" height="640" fill="#d9d9d9"/>
  <rect x="1500" y="80" width="70" height="640" fill="#d0d0d0"/>
  <!-- กรอบรูปบนผนัง -->
  <rect x="250" y="210" width="300" height="200" fill="#2f2f2f"/>
  <rect x="268" y="228" width="264" height="164" fill="#a9a9a9"/>
  <rect x="600" y="250" width="150" height="160" fill="#3a3a3a"/>
  <rect x="614" y="264" width="122" height="132" fill="#cfcfcf"/>
  <!-- พื้น -->
  <rect y="720" width="1600" height="280" fill="url(#floor)"/>
  <!-- พรม -->
  <ellipse cx="640" cy="900" rx="560" ry="90" fill="#9c9c9c"/>
  <!-- โซฟา -->
  <rect x="140" y="560" width="900" height="80" rx="28" fill="#4a4a4a"/>
  <rect x="120" y="620" width="940" height="140" rx="30" fill="#3d3d3d"/>
  <rect x="100" y="590" width="90" height="190" rx="30" fill="#353535"/>
  <rect x="1010" y="590" width="90" height="190" rx="30" fill="#353535"/>
  <rect x="200" y="600" width="250" height="70" rx="20" fill="#5c5c5c"/>
  <rect x="470" y="600" width="250" height="70" rx="20" fill="#575757"/>
  <rect x="740" y="600" width="250" height="70" rx="20" fill="#5c5c5c"/>
  <rect x="160" y="770" width="16" height="40" fill="#1e1e1e"/>
  <rect x="1020" y="770" width="16" height="40" fill="#1e1e1e"/>
  <!-- โต๊ะกลาง -->
  <ellipse cx="620" cy="860" rx="210" ry="38" fill="#222"/>
  <rect x="600" y="860" width="40" height="70" fill="#1a1a1a"/>
  <!-- โคมไฟห้อยสีดำ 2 ดวง -->
  <rect x="487" y="0" width="5" height="300" fill="#1a1a1a"/>
  <path d="M430 360 Q490 270 550 360 Z" fill="#111"/>
  <ellipse cx="490" cy="372" rx="120" ry="40" fill="url(#glow)" opacity="0.6"/>
  <rect x="757" y="0" width="5" height="250" fill="#1a1a1a"/>
  <path d="M700 310 Q760 220 820 310 Z" fill="#111"/>
  <ellipse cx="760" cy="322" rx="120" ry="40" fill="url(#glow)" opacity="0.6"/>
  <!-- ต้นไม้ในกระถาง -->
  <rect x="1280" y="760" width="110" height="130" rx="10" fill="#2c2c2c"/>
  <ellipse cx="1335" cy="640" rx="140" ry="170" fill="#4d4d4d"/>
  <ellipse cx="1260" cy="600" rx="70" ry="120" fill="#595959"/>
  <ellipse cx="1410" cy="610" rx="70" ry="120" fill="#454545"/>
  <!-- โคมไฟตั้งพื้น -->
  <rect x="1150" y="460" width="8" height="330" fill="#1f1f1f"/>
  <path d="M1100 470 L1210 470 L1185 400 L1125 400 Z" fill="#e6e6e6"/>
</svg>
